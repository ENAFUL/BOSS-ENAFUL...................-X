name: Enaful Music Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Enaful Music Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: |
        # লিনাক্স ফরম্যাট ফিক্স করা হয়েছে (৫ ঘণ্টা ৩০ মিনিট = ৩৩০ মিনিট)
        timeout 330m python3 bot.py || echo "Workflow cycled smoothly to avoid GitHub limits."
