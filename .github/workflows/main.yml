name: Enaful Music Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য
  schedule:
    # প্রতি ৫ ঘণ্টা পরপর অটো-রিস্টার্ট হবে (GitHub Actions-এর ৬ ঘণ্টার লিমিট এড়ানোর জন্য)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # বারবার ডাউনলোডের ঝামেলা এড়াতে ক্যাশ ব্যবহার

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Enaful Music Bot
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: |
        # ৭৪ মিনিটের টাইমআউট সেট করা হলো (GitHub-এর ৬ ঘণ্টা লিমিট শেষ হওয়ার আগেই এটি ফ্রেশ রিস্টার্ট নেবে)
        timeout 5h30m python3 bot.py || echo "Workflow cycled smoothly to avoid GitHub limits."
